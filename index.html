<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桌遊店管理助手 - 專業版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { transition: all 0.2s; }
        input[type="time"], input[type="date"] { border: none; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
        .rent-item.returned { opacity: 0.6; background-color: #f9fafb; border-left: 4px solid #10b981; }
        .rent-item.active { border-left: 4px solid #f59e0b; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-32">

    <!-- 頂部標題與日期選擇 -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold"><i class="fas fa-calculator mr-2 text-yellow-400"></i>桌遊店管理助手</h1>
            <div id="saveStatus" class="text-xs bg-green-500 px-2 py-1 rounded hidden transition-opacity">已自動儲存</div>
        </div>
        <div class="flex items-center bg-slate-800 rounded-lg p-2">
            <i class="fas fa-calendar-alt mr-2"></i>
            <input type="date" id="datePicker" class="bg-transparent border-none text-white focus:outline-none w-full text-lg">
        </div>
    </header>

    <main class="p-4 space-y-6">
        
        <!-- 一般桌遊客人區 -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-slate-700"><i class="fas fa-clock text-blue-600 mr-2"></i>一般桌遊區</h2>
                <button onclick="addGeneralGuest()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm">
                    <i class="fas fa-plus mr-1"></i>開桌
                </button>
            </div>
            <div id="generalList" class="space-y-3"></div>
        </section>

        <hr class="border-gray-300">

        <!-- 打牌客人區 -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-slate-700"><i class="fas fa-suit-spade text-purple-600 mr-2"></i>打牌客人 ($100/日)</h2>
                <button onclick="addCardPlayer()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm">
                    <i class="fas fa-user-plus mr-1"></i>登記
                </button>
            </div>
            <div id="cardPlayerList" class="bg-white rounded-xl shadow-sm divide-y overflow-hidden border border-gray-200"></div>
        </section>

        <hr class="border-gray-300">

        <!-- 桌遊租借管理區 -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-slate-700"><i class="fas fa-box-open text-orange-500 mr-2"></i>桌遊租借管理 (未歸還會持續顯示)</h2>
                <button onclick="addRental()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm">
                    <i class="fas fa-hand-holding-heart mr-1"></i>新增租借
                </button>
            </div>
            <div id="rentalList" class="space-y-3"></div>
        </section>

        <hr class="border-gray-300">

        <!-- 其他商品與備註 -->
        <section>
            <h2 class="text-lg font-bold text-slate-700 mb-3"><i class="fas fa-shopping-cart text-emerald-500 mr-2"></i>商品銷售 / 雜項備註</h2>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <textarea id="extraNotes" oninput="updateNotes(this.value)" placeholder="例：賣出可樂..." class="w-full h-24 p-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"></textarea>
                <div class="mt-2 flex items-center">
                    <span class="text-sm text-gray-500 mr-2">商品金額統計 ($):</span>
                    <input type="number" id="extraIncome" onchange="updateExtraIncome(this.value)" class="w-24 border-b border-gray-300 focus:border-emerald-500 text-right font-bold text-emerald-600 outline-none" value="0">
                </div>
            </div>
        </section>

    </main>

    <!-- 頁尾總結統計 -->
    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 text-white border-t p-4 grid grid-cols-4 gap-2 text-center shadow-2xl z-50">
        <div class="border-r border-slate-700">
            <div id="totalGeneralCount" class="font-bold text-blue-400">0</div>
            <div class="text-[10px] text-slate-400 uppercase">人數</div>
        </div>
        <div class="border-r border-slate-700">
            <div id="totalCardCount" class="font-bold text-purple-400">0</div>
            <div class="text-[10px] text-slate-400 uppercase">打牌</div>
        </div>
        <div class="border-r border-slate-700">
            <div id="totalRentalIncome" class="font-bold text-orange-400">0</div>
            <div class="text-[10px] text-slate-400 uppercase">租金收入</div>
        </div>
        <div>
            <div id="grandTotal" class="font-black text-yellow-400 text-lg">$ 0</div>
            <div class="text-[10px] text-slate-400 uppercase">今日總額</div>
        </div>
    </footer>

    <script>
        let db = {
            daily: {},
            rentals: []
        };
        const datePicker = document.getElementById('datePicker');

        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            datePicker.value = today;
            loadData();
        };

        datePicker.onchange = () => loadData();

        function loadData() {
            const date = datePicker.value;
            const saved = localStorage.getItem('boardgame_pro_db_v2');
            if (saved) {
                db = JSON.parse(saved);
            }
            
            if (!db.daily) db.daily = {};
            if (!db.rentals) db.rentals = [];
            
            if (!db.daily[date]) {
                db.daily[date] = { 
                    general: [], 
                    cardPlayers: [], 
                    extraNotes: '', 
                    extraIncome: 0 
                };
            }
            
            document.getElementById('extraNotes').value = db.daily[date].extraNotes || '';
            document.getElementById('extraIncome').value = db.daily[date].extraIncome || 0;
            render();
        }

        function saveData() {
            localStorage.setItem('boardgame_pro_db_v2', JSON.stringify(db));
            const status = document.getElementById('saveStatus');
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 800);
            updateTotals();
        }

        function formatTimeTo10Min(date) {
            let minutes = date.getMinutes();
            let roundedMinutes = Math.round(minutes / 10) * 10;
            let hours = date.getHours();
            if (roundedMinutes === 60) { roundedMinutes = 0; hours += 1; }
            return hours.toString().padStart(2, '0') + ":" + roundedMinutes.toString().padStart(2, '0');
        }

        function calculateFee(count, start, end) {
            if (!start || !end || count <= 0) return 0;
            const [h1, m1] = start.split(':').map(Number);
            const [h2, m2] = end.split(':').map(Number);
            let diffInMinutes = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diffInMinutes <= 0) return 0;
            const hours = diffInMinutes / 60;
            let pricePerPerson = hours <= 2 ? 60 : 60 + (Math.ceil(hours - 2) * 20);
            return pricePerPerson * count;
        }

        // --- 一般客人 ---
        function addGeneralGuest() {
            const date = datePicker.value;
            db.daily[date].general.push({ id: Date.now(), count: 1, startTime: formatTimeTo10Min(new Date()), endTime: '', fee: 0 });
            saveData(); render();
        }

        function updateGeneral(id, field, value) {
            const date = datePicker.value;
            const item = db.daily[date].general.find(i => i.id === id);
            if (item) {
                item[field] = value;
                item.fee = calculateFee(item.count, item.startTime, item.endTime);
                saveData();
                if (['endTime', 'startTime', 'count'].includes(field)) render();
            }
        }

        function checkoutGeneral(id) {
            const date = datePicker.value;
            const item = db.daily[date].general.find(i => i.id === id);
            if (item) {
                const nowTime = formatTimeTo10Min(new Date());
                
                // 檢查是否早於入場時間
                const [h1, m1] = item.startTime.split(':').map(Number);
                const [h2, m2] = nowTime.split(':').map(Number);
                if ((h2 * 60 + m2) <= (h1 * 60 + m1)) {
                    alert("當前時間不晚於入場時間，請手動調整。");
                    return;
                }

                item.endTime = nowTime;
                item.fee = calculateFee(item.count, item.startTime, item.endTime);
                saveData();
                render();
            }
        }

        function deleteGeneral(id) {
            if(!confirm('確定刪除此桌紀錄？')) return;
            db.daily[datePicker.value].general = db.daily[datePicker.value].general.filter(i => i.id !== id);
            saveData(); render();
        }

        // --- 打牌客人 ---
        function addCardPlayer() {
            const name = prompt("請輸入打牌客人姓名:");
            if (!name) return;
            db.daily[datePicker.value].cardPlayers.push({ id: Date.now(), name: name, paid: false, fee: 100 });
            saveData(); render();
        }

        function togglePaid(id) {
            const item = db.daily[datePicker.value].cardPlayers.find(i => i.id === id);
            if (item) { item.paid = !item.paid; saveData(); render(); }
        }

        function deletePlayer(id) {
            db.daily[datePicker.value].cardPlayers = db.daily[datePicker.value].cardPlayers.filter(i => i.id !== id);
            saveData(); render();
        }

        // --- 租借功能 ---
        function addRental() {
            const gameName = prompt("請輸入租借桌遊名稱:");
            if (!gameName) return;
            const fee = prompt("請輸入租借費用:", "50");
            if (fee === null) return;
            
            db.rentals.push({
                id: Date.now(),
                name: gameName,
                fee: parseFloat(fee) || 0,
                rentDate: datePicker.value,
                returnDate: null,
                isReturned: false
            });
            saveData(); render();
        }

        function returnRental(id) {
            const item = db.rentals.find(i => i.id === id);
            if (item) {
                item.isReturned = true;
                item.returnDate = datePicker.value;
                saveData(); render();
            }
        }

        function deleteRental(id) {
            if(!confirm('確定刪除此租借紀錄？')) return;
            db.rentals = db.rentals.filter(i => i.id !== id);
            saveData(); render();
        }

        // --- 雜項 ---
        function updateNotes(val) { db.daily[datePicker.value].extraNotes = val; saveData(); }
        function updateExtraIncome(val) { db.daily[datePicker.value].extraIncome = parseFloat(val) || 0; saveData(); }

        function render() {
            const date = datePicker.value;
            const dailyData = db.daily[date];

            // 一般區
            document.getElementById('generalList').innerHTML = dailyData.general.map(item => {
                const fee = calculateFee(item.count, item.startTime, item.endTime);
                const isErr = item.endTime && fee === 0;
                return `<div class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${item.endTime ? (isErr ? 'border-red-500 bg-red-50' : 'border-gray-400 bg-gray-50') : 'border-blue-500'}">
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-gray-400">人數</span>
                            <input type="number" value="${item.count}" onchange="updateGeneral(${item.id}, 'count', this.value)" class="w-10 border-b-2 border-blue-100 text-center font-bold text-blue-600 focus:outline-none bg-transparent">
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-gray-400 block">金額</span>
                            <span class="font-bold ${isErr ? 'text-red-600' : 'text-blue-700'}">$ ${fee}</span>
                        </div>
                    </div>
                    <div class="flex items-end justify-between">
                        <div class="flex space-x-4">
                            <div><label class="text-[10px] text-gray-400 block">入場</label><input type="time" step="600" value="${item.startTime}" onchange="updateGeneral(${item.id}, 'startTime', this.value)" class="text-sm font-semibold text-gray-700"></div>
                            <div><label class="text-[10px] text-gray-400 block">離場</label><input type="time" step="600" value="${item.endTime}" onchange="updateGeneral(${item.id}, 'endTime', this.value)" class="text-sm font-semibold ${!item.endTime ? 'text-blue-500 font-bold' : 'text-gray-700'}"></div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${!item.endTime ? `<button onclick="checkoutGeneral(${item.id})" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-xs font-bold hover:bg-blue-200 transition-colors"><i class="fas fa-sign-out-alt mr-1"></i>立即結帳</button>` : ''}
                            <button onclick="deleteGeneral(${item.id})" class="text-gray-300 hover:text-red-400 p-2"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('') || '<p class="text-center text-gray-400 text-sm py-4 bg-white rounded-xl border-2 border-dashed border-gray-200">目前無開桌</p>';

            // 打牌區
            document.getElementById('cardPlayerList').innerHTML = dailyData.cardPlayers.map(item => `
                <div class="flex justify-between items-center p-4 ${item.paid ? 'bg-green-50' : ''}">
                    <div class="flex items-center">
                        <input type="checkbox" ${item.paid ? 'checked' : ''} onchange="togglePaid(${item.id})" class="w-5 h-5 mr-3 accent-green-600">
                        <span class="${item.paid ? 'line-through text-gray-400' : 'font-medium text-gray-700'}">${item.name}</span>
                    </div>
                    <button onclick="deletePlayer(${item.id})" class="text-gray-300 hover:text-red-400"><i class="fas fa-times"></i></button>
                </div>`).join('') || '<p class="p-4 text-gray-400 text-center text-sm italic">無登記打牌客人</p>';

            // 租借區
            const visibleRentals = db.rentals.filter(r => !r.isReturned || r.returnDate === date);
            document.getElementById('rentalList').innerHTML = visibleRentals.map(item => `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 rent-item ${item.isReturned ? 'returned' : 'active'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-bold text-slate-700">${item.name}</div>
                            <div class="text-[10px] text-gray-500 mt-1">
                                <i class="fas fa-sign-out-alt mr-1"></i>出借: ${item.rentDate}
                                ${item.isReturned ? `<br><i class="fas fa-check-circle text-green-500 mr-1"></i>歸還日期: ${item.returnDate}` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-orange-600">$${item.fee}</div>
                            ${!item.isReturned ? 
                                `<button onclick="returnRental(${item.id})" class="mt-2 bg-green-500 text-white text-[10px] px-3 py-1 rounded-full font-bold shadow-sm">在此日期歸還</button>` : 
                                `<span class="text-[10px] text-green-600 font-bold block mt-2">已歸還</span>`
                            }
                        </div>
                    </div>
                    <div class="flex justify-end mt-1">
                         <button onclick="deleteRental(${item.id})" class="text-gray-300 hover:text-red-400 text-[10px]"><i class="fas fa-trash-alt"></i> 刪除紀錄</button>
                    </div>
                </div>`).join('') || '<p class="text-center text-gray-400 text-sm py-4 bg-white rounded-xl border-2 border-dashed border-gray-200">尚無租借紀錄</p>';

            updateTotals();
        }

        function updateTotals() {
            const date = datePicker.value;
            const dailyData = db.daily[date];
            const gIncome = dailyData.general.reduce((sum, item) => sum + calculateFee(item.count, item.startTime, item.endTime), 0);
            const cIncome = dailyData.cardPlayers.reduce((sum, item) => sum + (item.paid ? 100 : 0), 0);
            const rIncome = db.rentals.filter(r => r.returnDate === date).reduce((sum, item) => sum + (item.fee || 0), 0);
            
            document.getElementById('totalGeneralCount').innerText = dailyData.general.reduce((sum, item) => sum + parseInt(item.count || 0), 0);
            document.getElementById('totalCardCount').innerText = dailyData.cardPlayers.length;
            document.getElementById('totalRentalIncome').innerText = '$ ' + rIncome;
            document.getElementById('grandTotal').innerText = '$ ' + (gIncome + cIncome + rIncome + (dailyData.extraIncome || 0));
        }
    </script>
</body>
</html>
