<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桌遊店管理助手 - 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        input[type="time"], input[type="date"] { border: none; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
        .rent-item.returned { opacity: 0.6; background-color: #f9fafb; border-left: 4px solid #10b981; }
        .rent-item.active { border-left: 4px solid #f59e0b; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-32">

    <div id="loading" class="loading-overlay">
        <div class="text-center">
            <i class="fas fa-circle-notch fa-spin text-3xl text-blue-600 mb-2"></i>
            <p class="text-gray-500 text-sm">雲端資料同步中...</p>
        </div>
    </div>

    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold"><i class="fas fa-calculator mr-2 text-yellow-400"></i>桌遊店助手 <span class="text-[10px] bg-blue-500 px-1 rounded">CLOUD</span></h1>
            <div id="syncStatus" class="text-[10px] text-gray-400">正在檢查連線...</div>
        </div>
        <div class="flex items-center bg-slate-800 rounded-lg p-2">
            <i class="fas fa-calendar-alt mr-2 text-blue-400"></i>
            <input type="date" id="datePicker" class="bg-transparent border-none text-white focus:outline-none w-full text-lg">
        </div>
    </header>

    <main class="p-4 space-y-6">
        <!-- 一般桌遊客人區 -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-slate-700"><i class="fas fa-clock text-blue-600 mr-2"></i>一般桌遊區</h2>
                <button onclick="addGeneralGuest()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm">
                    <i class="fas fa-plus mr-1"></i>開桌
                </button>
            </div>
            <div id="generalList" class="space-y-3"></div>
        </section>

        <!-- 打牌客人區 -->
        <section>
            <div class="flex justify-between items-center mb-3 border-t pt-4 border-gray-200">
                <h2 class="text-lg font-bold text-slate-700"><i class="fas fa-suit-spade text-purple-600 mr-2"></i>打牌客人 ($100/日)</h2>
                <button onclick="addCardPlayer()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm">
                    <i class="fas fa-user-plus mr-1"></i>登記
                </button>
            </div>
            <div id="cardPlayerList" class="bg-white rounded-xl shadow-sm divide-y overflow-hidden border border-gray-200"></div>
        </section>

        <!-- 桌遊租借管理區 -->
        <section>
            <div class="flex justify-between items-center mb-3 border-t pt-4 border-gray-200">
                <h2 class="text-lg font-bold text-slate-700"><i class="fas fa-box-open text-orange-500 mr-2"></i>租借管理</h2>
                <button onclick="addRental()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm">
                    <i class="fas fa-hand-holding-heart mr-1"></i>新增租借
                </button>
            </div>
            <div id="rentalList" class="space-y-3"></div>
        </section>

        <!-- 商品銷售 -->
        <section>
            <h2 class="text-lg font-bold text-slate-700 mb-3 border-t pt-4 border-gray-200"><i class="fas fa-shopping-cart text-emerald-500 mr-2"></i>商品與雜項</h2>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <textarea id="extraNotes" oninput="updateNotes(this.value)" placeholder="例：賣出飲料..." class="w-full h-24 p-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none text-sm"></textarea>
                <div class="mt-2 flex items-center">
                    <span class="text-sm text-gray-500 mr-2">金額統計 ($):</span>
                    <input type="number" id="extraIncome" onchange="updateExtraIncome(this.value)" class="w-24 border-b border-gray-300 focus:border-emerald-500 text-right font-bold text-emerald-600 outline-none" value="0">
                </div>
            </div>
        </section>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 text-white border-t p-4 grid grid-cols-4 gap-2 text-center shadow-2xl z-50">
        <div class="border-r border-slate-700"><div id="totalGeneralCount" class="font-bold text-blue-400">0</div><div class="text-[10px] text-slate-400">人數</div></div>
        <div class="border-r border-slate-700"><div id="totalCardCount" class="font-bold text-purple-400">0</div><div class="text-[10px] text-slate-400">打牌</div></div>
        <div class="border-r border-slate-700"><div id="totalRentalIncome" class="font-bold text-orange-400">0</div><div class="text-[10px] text-slate-400">租金</div></div>
        <div><div id="grandTotal" class="font-black text-yellow-400 text-lg">$ 0</div><div class="text-[10px] text-slate-400">今日總額</div></div>
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, addDoc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 設定由環境提供
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'board-game-pro';

        let user = null;
        let unsubscribeDaily = null;
        let unsubscribeRentals = null;
        let currentDailyData = { general: [], cardPlayers: [], extraNotes: '', extraIncome: 0 };
        let allRentals = [];

        // 初始化日期
        const datePicker = document.getElementById('datePicker');
        datePicker.value = new Date().toISOString().split('T')[0];

        // 登入邏輯
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error", error);
                document.getElementById('syncStatus').innerText = "連線失敗";
            }
        };
        initAuth();

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('syncStatus').innerText = `雲端已連線 (ID: ${user.uid.substring(0,5)})`;
                document.getElementById('loading').classList.add('hidden');
                startSync();
            }
        });

        // 監聽日期變化
        datePicker.addEventListener('change', () => {
            if (unsubscribeDaily) unsubscribeDaily();
            startSync();
        });

        // 資料同步
        function startSync() {
            if (!user) return;
            const date = datePicker.value;

            // 1. 監聽每日資料 (Public Data)
            const dailyDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'daily', date);
            unsubscribeDaily = onSnapshot(dailyDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    currentDailyData = docSnap.data();
                } else {
                    currentDailyData = { general: [], cardPlayers: [], extraNotes: '', extraIncome: 0 };
                }
                render();
            }, (error) => console.error("Snapshot error:", error));

            // 2. 監聽租借資料 (獨立集合以便跨日)
            if (!unsubscribeRentals) {
                const rentalsCol = collection(db, 'artifacts', appId, 'public', 'data', 'rentals');
                unsubscribeRentals = onSnapshot(rentalsCol, (querySnapshot) => {
                    allRentals = [];
                    querySnapshot.forEach((doc) => {
                        allRentals.push({ id: doc.id, ...doc.data() });
                    });
                    render();
                });
            }
        }

        // --- 功能函數 ---
        window.formatTimeTo10Min = (date) => {
            let minutes = date.getMinutes();
            let rounded = Math.round(minutes / 10) * 10;
            let hours = date.getHours();
            if (rounded === 60) { rounded = 0; hours += 1; }
            return hours.toString().padStart(2, '0') + ":" + rounded.toString().padStart(2, '0');
        };

        window.calculateFee = (count, start, end) => {
            if (!start || !end || count <= 0) return 0;
            const [h1, m1] = start.split(':').map(Number);
            const [h2, m2] = end.split(':').map(Number);
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff <= 0) return 0;
            const hours = diff / 60;
            let perPerson = hours <= 2 ? 60 : 60 + (Math.ceil(hours - 2) * 20);
            return perPerson * count;
        };

        // --- 一般客人操作 ---
        window.addGeneralGuest = async () => {
            const date = datePicker.value;
            const newGuest = {
                id: Date.now().toString(),
                count: 1,
                startTime: window.formatTimeTo10Min(new Date()),
                endTime: '',
                fee: 0
            };
            const updated = { ...currentDailyData, general: [...currentDailyData.general, newGuest] };
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), updated);
        };

        window.updateGeneral = async (id, field, value) => {
            const date = datePicker.value;
            const newList = currentDailyData.general.map(g => {
                if (g.id === id) {
                    const updated = { ...g, [field]: value };
                    updated.fee = window.calculateFee(updated.count, updated.startTime, updated.endTime);
                    return updated;
                }
                return g;
            });
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), { general: newList });
        };

        window.checkoutGeneral = async (id) => {
            const date = datePicker.value;
            const nowTime = window.formatTimeTo10Min(new Date());
            const newList = currentDailyData.general.map(g => {
                if (g.id === id) {
                    const [h1, m1] = g.startTime.split(':').map(Number);
                    const [h2, m2] = nowTime.split(':').map(Number);
                    if ((h2 * 60 + m2) <= (h1 * 60 + m1)) { alert("時間不合理！"); return g; }
                    return { ...g, endTime: nowTime, fee: window.calculateFee(g.count, g.startTime, nowTime) };
                }
                return g;
            });
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), { general: newList });
        };

        window.deleteGeneral = async (id) => {
            if(!confirm("確定刪除？")) return;
            const date = datePicker.value;
            const newList = currentDailyData.general.filter(g => g.id !== id);
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), { general: newList });
        };

        // --- 打牌客人 ---
        window.addCardPlayer = async () => {
            const name = prompt("姓名:");
            if (!name) return;
            const date = datePicker.value;
            const newP = { id: Date.now().toString(), name, paid: false };
            const updated = { ...currentDailyData, cardPlayers: [...currentDailyData.cardPlayers, newP] };
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), updated);
        };

        window.togglePaid = async (id) => {
            const date = datePicker.value;
            const newList = currentDailyData.cardPlayers.map(p => p.id === id ? { ...p, paid: !p.paid } : p);
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), { cardPlayers: newList });
        };

        window.deletePlayer = async (id) => {
            const date = datePicker.value;
            const newList = currentDailyData.cardPlayers.filter(p => p.id !== id);
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), { cardPlayers: newList });
        };

        // --- 租借功能 ---
        window.addRental = async () => {
            const name = prompt("桌遊名稱:");
            if (!name) return;
            const fee = parseFloat(prompt("費用:", "50")) || 0;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rentals'), {
                name, fee, rentDate: datePicker.value, returnDate: null, isReturned: false
            });
        };

        window.returnRental = async (id) => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'rentals', id);
            await updateDoc(ref, { isReturned: true, returnDate: datePicker.value });
        };

        window.deleteRental = async (id) => {
            if(!confirm("確定刪除租借紀錄？")) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rentals', id));
        };

        // --- 備註 ---
        window.updateNotes = async (val) => {
            const date = datePicker.value;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), { extraNotes: val });
        };
        window.updateExtraIncome = async (val) => {
            const date = datePicker.value;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'daily', date), { extraIncome: parseFloat(val) || 0 });
        };

        // --- 渲染 UI ---
        function render() {
            const date = datePicker.value;
            
            // 備註區
            document.getElementById('extraNotes').value = currentDailyData.extraNotes || '';
            document.getElementById('extraIncome').value = currentDailyData.extraIncome || 0;

            // 一般區
            document.getElementById('generalList').innerHTML = currentDailyData.general.map(item => {
                const isErr = item.endTime && item.fee === 0;
                return `<div class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${item.endTime ? (isErr ? 'border-red-500 bg-red-50' : 'border-gray-400 bg-gray-50') : 'border-blue-500'}">
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center space-x-2"><span class="text-xs text-gray-400">人數</span><input type="number" value="${item.count}" onchange="updateGeneral('${item.id}', 'count', this.value)" class="w-10 border-b border-blue-100 text-center font-bold text-blue-600 bg-transparent"></div>
                        <div class="text-right text-sm font-bold ${isErr ? 'text-red-600' : 'text-blue-700'}">$ ${item.fee}</div>
                    </div>
                    <div class="flex items-end justify-between">
                        <div class="flex space-x-3">
                            <div><label class="text-[10px] text-gray-400 block">入</label><input type="time" step="600" value="${item.startTime}" onchange="updateGeneral('${item.id}', 'startTime', this.value)" class="text-xs font-semibold"></div>
                            <div><label class="text-[10px] text-gray-400 block">離</label><input type="time" step="600" value="${item.endTime}" onchange="updateGeneral('${item.id}', 'endTime', this.value)" class="text-xs font-semibold"></div>
                        </div>
                        <div class="flex space-x-2">
                            ${!item.endTime ? `<button onclick="checkoutGeneral('${item.id}')" class="bg-blue-600 text-white px-2 py-1 rounded text-[10px]">結帳</button>` : ''}
                            <button onclick="deleteGeneral('${item.id}')" class="text-gray-300"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('') || '<p class="text-center text-xs text-gray-400 py-4">本日無開桌</p>';

            // 打牌區
            document.getElementById('cardPlayerList').innerHTML = currentDailyData.cardPlayers.map(p => `
                <div class="flex justify-between items-center p-3 ${p.paid ? 'bg-green-50' : ''}">
                    <div class="flex items-center">
                        <input type="checkbox" ${p.paid ? 'checked' : ''} onchange="togglePaid('${p.id}')" class="w-4 h-4 mr-2">
                        <span class="text-sm ${p.paid ? 'line-through text-gray-400' : ''}">${p.name}</span>
                    </div>
                    <button onclick="deletePlayer('${p.id}')" class="text-gray-200 text-xs"><i class="fas fa-times"></i></button>
                </div>`).join('');

            // 租借區
            const visibleRentals = allRentals.filter(r => !r.isReturned || r.returnDate === date);
            document.getElementById('rentalList').innerHTML = visibleRentals.map(r => `
                <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 ${r.isReturned ? 'returned' : 'active'}">
                    <div class="flex justify-between items-start">
                        <div class="text-sm font-bold text-gray-700">${r.name}<div class="text-[9px] text-gray-400 font-normal">借: ${r.rentDate}${r.isReturned ? ' / 還: '+r.returnDate : ''}</div></div>
                        <div class="text-right">
                            <div class="text-orange-600 font-bold">$${r.fee}</div>
                            ${!r.isReturned ? `<button onclick="returnRental('${r.id}')" class="text-[9px] bg-green-500 text-white px-2 py-0.5 rounded-full mt-1">今日歸還</button>` : `<span class="text-[9px] text-green-600">已歸還</span>`}
                        </div>
                    </div>
                    <div class="text-right mt-1"><button onclick="deleteRental('${r.id}')" class="text-[9px] text-gray-300">刪除</button></div>
                </div>`).join('') || '<p class="text-center text-xs text-gray-400 py-4">無租借中桌遊</p>';

            updateTotalsUI();
        }

        function updateTotalsUI() {
            const gIn = currentDailyData.general.reduce((s, i) => s + (i.fee || 0), 0);
            const cIn = currentDailyData.cardPlayers.reduce((s, i) => s + (i.paid ? 100 : 0), 0);
            const rIn = allRentals.filter(r => r.returnDate === datePicker.value).reduce((s, i) => s + (i.fee || 0), 0);
            const total = gIn + cIn + rIn + (currentDailyData.extraIncome || 0);

            document.getElementById('totalGeneralCount').innerText = currentDailyData.general.reduce((s, i) => s + parseInt(i.count || 0), 0);
            document.getElementById('totalCardCount').innerText = currentDailyData.cardPlayers.length;
            document.getElementById('totalRentalIncome').innerText = '$ ' + rIn;
            document.getElementById('grandTotal').innerText = '$ ' + total;
        }
    </script>
</body>
</html>
